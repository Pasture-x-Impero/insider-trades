<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insider Trades Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📈 Norwegian Insider Trades</h1>
            <p>Track the latest insider trading activity from Oslo Stock Exchange</p>
        </div>
        
        <div class="controls">
            <div class="filter-group">
                <label for="companyFilter">Company:</label>
                <input type="text" id="companyFilter" placeholder="Enter company name or ticker..." />
                
                <label for="tradeType">Type:</label>
                <select id="tradeType">
                    <option value="">All Types</option>
                    <option value="buy">Buy</option>
                    <option value="sell">Sell</option>
                </select>
                
                <label for="fromDate">From Date:</label>
                <input type="date" id="fromDate" />
                
                <button class="btn" onclick="loadTrades()">Refresh Data</button>
            </div>
        </div>
        
        <div class="trades-container">
            <div id="loadingIndicator" class="loading" style="display: none;">
                <h3>Loading insider trades...</h3>
                <p>Fetching the latest trading data</p>
            </div>
            
            <div id="tradesResults"></div>
        </div>
    </div>

    <script>
        // API configuration - use proxy endpoint to avoid CORS
        const API_URL = "/api/insider-trades";

        let allTrades = [];
        let rawApiData = [];

        // Function to fetch data via proxy
        async function fetchInsiderTrades(fromDate = null) {
            try {
                const today = new Date();
                const defaultFromDate = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000); // 30 days ago
                const dateStr = fromDate || defaultFromDate.toISOString().split('T')[0];

                const url = `${API_URL}?fromDate=${dateStr}`;

                console.log('Fetching from:', url);

                const response = await fetch(url);

                console.log('Response status:', response.status);

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('API error response:', errorText);
                    throw new Error(`API request failed with status ${response.status}: ${errorText}`);
                }

                const data = await response.json();
                console.log('Received data:', data);
                return data;
            } catch (error) {
                console.error('Error fetching insider trades:', error);
                throw error;
            }
        }

        // Function to parse Oslo Stock Exchange data into our format
        function parseApiData(apiData) {
            if (!apiData || !apiData.data || !apiData.data.messages || !Array.isArray(apiData.data.messages)) {
                console.error('Invalid API data structure:', apiData);
                return [];
            }

            // First, we need to fetch detailed information for each message
            // For now, we'll parse what we can from the list data
            return apiData.data.messages.map(item => {
                const title = item.title || '';
                const publishTime = item.publishedTime || '';
                const ticker = item.issuerSign || extractTickerFromTitle(title);
                const company = item.issuerName || extractCompanyFromTitle(title);

                // The body field contains detailed transaction info if available
                const body = item.body || '';

                // Extract trading details from both title and body
                const tradeInfo = parseTradeInfo(title, body);

                return {
                    id: item.messageId,
                    company: company || 'Unknown Company',
                    ticker: ticker || 'N/A',
                    insider: tradeInfo.insider || 'Unknown',
                    title: tradeInfo.position || 'Insider',
                    tradeType: tradeInfo.tradeType || 'unknown',
                    shares: tradeInfo.shares || 0,
                    price: tradeInfo.price || 0,
                    value: tradeInfo.value || (tradeInfo.shares * tradeInfo.price),
                    date: publishTime ? new Date(publishTime).toISOString().split('T')[0] : '',
                    filingDate: publishTime ? new Date(publishTime).toISOString().split('T')[0] : '',
                    originalTitle: title,
                    body: body,
                    newsId: item.newsId,
                    attachments: item.numbAttachments || 0
                };
            }).filter(trade => trade.ticker !== 'N/A');
        }

        // Helper function to extract ticker from title
        function extractTickerFromTitle(title) {
            const tickerMatch = title.match(/\(([A-Z]{2,5})\)/);
            return tickerMatch ? tickerMatch[1] : null;
        }

        // Helper function to extract company from title  
        function extractCompanyFromTitle(title) {
            // Remove ticker in parentheses and clean up
            const company = title.replace(/\([A-Z]{2,5}\)/, '').trim();
            // Take first part before common separators
            const cleanCompany = company.split(/[-–:]/, 1)[0].trim();
            return cleanCompany || null;
        }

        // Helper function to parse trade information from Norwegian text
        function parseTradeInfo(title, body) {
            const text = `${title} ${body}`;
            const textLower = text.toLowerCase();

            const info = {
                insider: null,
                position: null,
                tradeType: 'unknown',
                shares: 0,
                price: 0,
                value: 0
            };

            // Detect trade type (Norwegian and English terms)
            if (textLower.includes('kjøp') || textLower.includes('erverv') || textLower.includes('acquired') ||
                textLower.includes('bought') || textLower.includes('purchase')) {
                info.tradeType = 'buy';
            } else if (textLower.includes('salg') || textLower.includes('solgt') || textLower.includes('sold') ||
                       textLower.includes('sale') || textLower.includes('disposal')) {
                info.tradeType = 'sell';
            }

            // Extract insider name - look for patterns like "John Doe" or "Company AS, owned by John Doe"
            // Common patterns in Norwegian insider notifications:
            // "X, a company wholly owned by the CEO, Name"
            // "Name, CEO"
            // "Primary insider Name has..."

            // Try to extract name from "owned by the [position], Name" pattern
            let nameMatch = body.match(/owned by the (?:CEO|CFO|Chairman|Board Member|Director),?\s+([A-ZÆØÅ][a-zæøå]+(?:\s+[A-ZÆØÅ][a-zæøå]+)+)/i);
            if (nameMatch) {
                info.insider = nameMatch[1].trim();
            }

            // Try pattern: "Name, position,"
            if (!info.insider) {
                nameMatch = body.match(/([A-ZÆØÅ][a-zæøå]+(?:\s+[A-ZÆØÅ][a-zæøå]+)+),?\s+(?:CEO|CFO|styreleder|Chairman|Board Member|Director|administrerende direktør)/i);
                if (nameMatch) {
                    info.insider = nameMatch[1].trim();
                }
            }

            // Try pattern: "Primary insider Name" or just find capitalized name
            if (!info.insider) {
                nameMatch = body.match(/(?:Primary insider|Primærinnsider)\s+([A-ZÆØÅ][a-zæøå]+(?:\s+[A-ZÆØÅ][a-zæøå]+)+)/i);
                if (nameMatch) {
                    info.insider = nameMatch[1].trim();
                }
            }

            // Extract position/title
            if (textLower.includes('styreleder') || textLower.includes('chairman')) {
                info.position = 'Chairman';
            } else if (textLower.includes('administrerende direktør') || textLower.includes('ceo')) {
                info.position = 'CEO';
            } else if (textLower.includes('cfo') || textLower.includes('finansdirektør')) {
                info.position = 'CFO';
            } else if (textLower.includes('styremedlem') || textLower.includes('board member')) {
                info.position = 'Board Member';
            } else if (textLower.includes('director') && !textLower.includes('board')) {
                info.position = 'Director';
            } else if (textLower.includes('investor') || textLower.includes('aksjonær') || textLower.includes('shareholder')) {
                info.position = 'Investor';
            }

            // Extract shares - look for patterns like "85 226 shares" or "85,226 shares"
            let sharesMatch = body.match(/(\d+[\s,]*\d*)\s+(?:shares|aksjer)/i);
            if (sharesMatch) {
                // Remove spaces and commas from number
                info.shares = parseInt(sharesMatch[1].replace(/[\s,]/g, ''));
            }

            // Extract price - look for patterns like "NOK 0.64" or "share price of NOK0.64"
            let priceMatch = body.match(/(?:price|pris)(?:\s+of)?\s+(?:NOK|kr\.?)\s*(\d+[.,]\d+)/i);
            if (!priceMatch) {
                // Try pattern: "at NOK X"
                priceMatch = body.match(/at\s+(?:NOK|kr\.?)\s*(\d+[.,]\d+)/i);
            }
            if (priceMatch) {
                // Replace comma with dot for decimal
                info.price = parseFloat(priceMatch[1].replace(',', '.'));
            }

            // Calculate value if we have both shares and price
            if (info.shares > 0 && info.price > 0) {
                info.value = info.shares * info.price;
            } else {
                // Try to extract total value directly - patterns like "total value of NOK X"
                const valueMatch = body.match(/(?:total|value|verdi)(?:\s+of)?\s+(?:NOK|kr\.?)\s*([\d\s,]+(?:[.,]\d+)?)/i);
                if (valueMatch) {
                    info.value = parseFloat(valueMatch[1].replace(/[\s,]/g, '').replace(',', '.'));
                }
            }

            return info;
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('no-NO', {
                style: 'currency',
                currency: 'NOK',
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            }).format(amount);
        }

        function formatNumber(num) {
            return new Intl.NumberFormat('en-US').format(num);
        }

        function formatDate(dateString) {
            return new Date(dateString).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        function createTradeCard(trade) {
            // Construct the Oslo Børs news URL
            const sourceUrl = `https://newsweb.oslobors.no/message/${trade.newsId}`;

            return `
                <div class="trade-card">
                    <div class="trade-header">
                        <div class="company-info">
                            <div class="company-name">${trade.company}</div>
                            <span class="ticker">${trade.ticker}</span>
                        </div>
                        <a href="${sourceUrl}" target="_blank" rel="noopener noreferrer" class="trade-type ${trade.tradeType}" title="Click to view source announcement on Oslo Børs">
                            ${trade.tradeType} <i class="fa-solid fa-arrow-up-right-from-square external-icon"></i>
                        </a>
                    </div>
                    
                    <div class="trade-details">
                        <div class="detail-item">
                            <span class="detail-label">Insider</span>
                            <span class="detail-value">${trade.insider}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Title</span>
                            <span class="detail-value">${trade.title}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Shares</span>
                            <span class="detail-value">${formatNumber(trade.shares)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Price</span>
                            <span class="detail-value">${formatCurrency(trade.price)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Total Value</span>
                            <span class="detail-value">${formatCurrency(trade.value)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Trade Date</span>
                            <span class="detail-value">${formatDate(trade.date)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Filing Date</span>
                            <span class="detail-value">${formatDate(trade.filingDate)}</span>
                        </div>
                    </div>

                    <div class="stock-performance" id="performance-${trade.id}">
                        <div class="performance-loading">Loading current stock price...</div>
                    </div>

                    <div class="chart-container" style="display: none;" id="chart-container-${trade.id}">
                        <canvas id="chart-${trade.id}"></canvas>
                    </div>
                </div>
            `;
        }

        function filterTrades() {
            const companyFilter = document.getElementById('companyFilter').value.toLowerCase();
            const tradeTypeFilter = document.getElementById('tradeType').value;
            
            return allTrades.filter(trade => {
                const matchesCompany = !companyFilter || 
                    trade.company.toLowerCase().includes(companyFilter) ||
                    trade.ticker.toLowerCase().includes(companyFilter);
                
                const matchesType = !tradeTypeFilter || trade.tradeType === tradeTypeFilter;
                
                return matchesCompany && matchesType;
            });
        }

        function displayTrades(trades) {
            const resultsContainer = document.getElementById('tradesResults');
            
            if (trades.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="no-data">
                        <h3>No trades found</h3>
                        <p>Try adjusting your search criteria</p>
                    </div>
                `;
                return;
            }

            resultsContainer.innerHTML = trades
                .sort((a, b) => new Date(b.date) - new Date(a.date))
                .map(createTradeCard)
                .join('');

            // Load stock performance for each trade
            trades.forEach(trade => {
                if (trade.ticker && trade.ticker !== 'N/A') {
                    loadStockPerformance(trade);
                }
            });
        }

        async function loadStockPerformance(trade) {
            const performanceDiv = document.getElementById(`performance-${trade.id}`);
            const chartContainer = document.getElementById(`chart-container-${trade.id}`);

            try {
                // Fetch stock data from backend
                const response = await fetch(`/api/stock-data?ticker=${trade.ticker}&tradeDate=${trade.date}`);

                if (!response.ok) {
                    performanceDiv.innerHTML = `<div class="performance-info">Stock data not available for ${trade.ticker}</div>`;
                    return;
                }

                const stockData = await response.json();

                // Calculate performance
                const currentPrice = stockData.currentPrice;
                const tradePrice = trade.price;
                const priceChange = currentPrice - tradePrice;
                const percentChange = ((priceChange / tradePrice) * 100).toFixed(2);
                const gainLoss = priceChange * trade.shares;

                const isPositive = priceChange >= 0;
                const arrow = isPositive ? '↑' : '↓';
                const colorClass = isPositive ? 'gain' : 'loss';

                performanceDiv.innerHTML = `
                    <div class="performance-info">
                        <div class="performance-header">
                            <h4>Stock Performance Since Trade</h4>
                            <button class="toggle-chart-btn" onclick="toggleChart('${trade.id}')">
                                <i class="fa-solid fa-chart-line"></i> Show Chart
                            </button>
                        </div>
                        <div class="performance-metrics">
                            <div class="metric">
                                <span class="metric-label">Trade Price:</span>
                                <span class="metric-value">${formatCurrency(tradePrice)}</span>
                            </div>
                            <div class="metric">
                                <span class="metric-label">Current Price:</span>
                                <span class="metric-value">${formatCurrency(currentPrice)}</span>
                            </div>
                            <div class="metric">
                                <span class="metric-label">Change:</span>
                                <span class="metric-value ${colorClass}">
                                    ${arrow} ${formatCurrency(Math.abs(priceChange))} (${Math.abs(percentChange)}%)
                                </span>
                            </div>
                            <div class="metric">
                                <span class="metric-label">Position ${isPositive ? 'Gain' : 'Loss'}:</span>
                                <span class="metric-value ${colorClass}">
                                    ${arrow} ${formatCurrency(Math.abs(gainLoss))}
                                </span>
                            </div>
                        </div>
                    </div>
                `;

                // Create chart
                if (stockData.historicalPrices && stockData.historicalPrices.length > 0) {
                    createStockChart(trade, stockData);
                }

            } catch (error) {
                console.error('Error loading stock performance:', error);
                performanceDiv.innerHTML = `<div class="performance-info">Unable to load stock performance</div>`;
            }
        }

        function toggleChart(tradeId) {
            const chartContainer = document.getElementById(`chart-container-${tradeId}`);
            const button = event.target.closest('button');

            if (chartContainer.style.display === 'none') {
                chartContainer.style.display = 'block';
                button.innerHTML = '<i class="fa-solid fa-chart-line"></i> Hide Chart';
            } else {
                chartContainer.style.display = 'none';
                button.innerHTML = '<i class="fa-solid fa-chart-line"></i> Show Chart';
            }
        }

        function createStockChart(trade, stockData) {
            const ctx = document.getElementById(`chart-${trade.id}`).getContext('2d');

            const dates = stockData.historicalPrices.map(p => p.date);
            const prices = stockData.historicalPrices.map(p => p.close);

            // Find the index of the trade date
            const tradeDateIndex = dates.findIndex(d => d === trade.date);

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [{
                        label: `${trade.ticker} Stock Price`,
                        data: prices,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 2,
                        pointRadius: dates.map((_, i) => i === tradeDateIndex ? 8 : 3),
                        pointBackgroundColor: dates.map((_, i) => i === tradeDateIndex ? '#ff6b6b' : '#667eea'),
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    label += formatCurrency(context.parsed.y);
                                    if (context.dataIndex === tradeDateIndex) {
                                        label += ' (Insider Trade Date)';
                                    }
                                    return label;
                                }
                            }
                        },
                        annotation: tradeDateIndex >= 0 ? {
                            annotations: {
                                tradeLine: {
                                    type: 'line',
                                    xMin: tradeDateIndex,
                                    xMax: tradeDateIndex,
                                    borderColor: '#ff6b6b',
                                    borderWidth: 2,
                                    label: {
                                        display: true,
                                        content: 'Trade Date',
                                        position: 'start'
                                    }
                                }
                            }
                        } : {}
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            ticks: {
                                callback: function(value) {
                                    return formatCurrency(value);
                                }
                            }
                        },
                        x: {
                            ticks: {
                                maxTicksLimit: 10
                            }
                        }
                    }
                }
            });
        }

        async function loadTrades() {
            const loadingIndicator = document.getElementById('loadingIndicator');
            const resultsContainer = document.getElementById('tradesResults');
            const fromDateInput = document.getElementById('fromDate');
            
            loadingIndicator.style.display = 'block';
            resultsContainer.innerHTML = '';
            
            try {
                const fromDate = fromDateInput.value || null;
                const apiData = await fetchInsiderTrades(fromDate);
                rawApiData = apiData;
                allTrades = parseApiData(apiData);
                
                const filteredTrades = filterTrades();
                displayTrades(filteredTrades);
                
                console.log('Loaded', allTrades.length, 'insider trades');
            } catch (error) {
                console.error('Failed to load trades:', error);
                resultsContainer.innerHTML = `
                    <div class="no-data">
                        <h3>Failed to load trades</h3>
                        <p>There was an error loading data from the Oslo Stock Exchange API.</p>
                        <p><em>${error.message}</em></p>
                        <button class="btn" onclick="loadTrades()">Try Again</button>
                    </div>
                `;
            } finally {
                loadingIndicator.style.display = 'none';
            }
        }

        // Load initial data
        document.addEventListener('DOMContentLoaded', function() {
            // Set default from date to 30 days ago
            const fromDateInput = document.getElementById('fromDate');
            const thirtyDaysAgo = new Date();
            thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
            fromDateInput.value = thirtyDaysAgo.toISOString().split('T')[0];
            
            loadTrades();
        });

        // Add enter key support for company filter
        document.getElementById('companyFilter').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loadTrades();
            }
        });

        // Add real-time filtering (optional)
        document.getElementById('companyFilter').addEventListener('input', function() {
            // Debounced filtering
            clearTimeout(this.filterTimeout);
            this.filterTimeout = setTimeout(() => {
                const filteredTrades = filterTrades();
                displayTrades(filteredTrades);
            }, 300);
        });

        document.getElementById('tradeType').addEventListener('change', function() {
            const filteredTrades = filterTrades();
            displayTrades(filteredTrades);
        });
    </script>
</body>
</html>
