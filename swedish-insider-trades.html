<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swedish Insider Trades Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Swedish Insider Trades</h1>
            <p>Track the latest insider trading activity from Nasdaq Stockholm</p>
        </div>

        <div class="controls">
            <div class="filter-group">
                <label for="companyFilter">Company:</label>
                <input type="text" id="companyFilter" placeholder="Enter company name or ticker..." />

                <label for="tradeType">Type:</label>
                <select id="tradeType">
                    <option value="">All Types</option>
                    <option value="buy">Buy</option>
                    <option value="sell">Sell</option>
                </select>

                <label for="fromDate">From Date:</label>
                <input type="date" id="fromDate" />

                <button class="btn" onclick="loadTrades()">Refresh Data</button>
            </div>
        </div>

        <div class="trades-container">
            <div id="loadingIndicator" class="loading" style="display: none;">
                <h3>Loading insider trades...</h3>
                <p>Fetching the latest trading data from Finansinspektionen</p>
            </div>

            <div id="tradesResults"></div>
        </div>
    </div>

    <script>
        // API configuration - use proxy endpoint to avoid CORS
        const API_URL = "/api/swedish-insider-trades";

        let allTrades = [];
        let rawApiData = [];

        // Function to fetch data via proxy
        async function fetchInsiderTrades(fromDate = null) {
            try {
                const today = new Date();
                const defaultFromDate = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000); // 30 days ago
                const dateStr = fromDate || defaultFromDate.toISOString().split('T')[0];

                const url = `${API_URL}?fromDate=${dateStr}`;

                console.log('Fetching from:', url);

                const response = await fetch(url);

                console.log('Response status:', response.status);

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('API error response:', errorText);
                    throw new Error(`API request failed with status ${response.status}: ${errorText}`);
                }

                const data = await response.json();
                console.log('Received data:', data);
                return data;
            } catch (error) {
                console.error('Error fetching insider trades:', error);
                throw error;
            }
        }

        // Function to parse Finansinspektionen data into our format
        function parseApiData(apiData) {
            if (!apiData || !Array.isArray(apiData)) {
                console.error('Invalid API data structure:', apiData);
                return [];
            }

            return apiData.map((item, index) => {
                // Determine trade type from transaction nature
                const transactionNature = (item.transactionNature || '').toLowerCase();
                let tradeType = 'unknown';

                if (transactionNature.includes('förvärv') || transactionNature.includes('acquisition') ||
                    transactionNature.includes('köp') || transactionNature.includes('purchase')) {
                    tradeType = 'buy';
                } else if (transactionNature.includes('avyttring') || transactionNature.includes('disposal') ||
                           transactionNature.includes('försäljning') || transactionNature.includes('sale')) {
                    tradeType = 'sell';
                }

                // Calculate total value
                const quantity = parseFloat(item.quantity || 0);
                const price = parseFloat(item.price || 0);
                const totalValue = quantity * price;

                return {
                    id: item.id || `trade-${index}`,
                    company: item.issuer || 'Unknown Company',
                    ticker: item.ticker || extractTicker(item.issuer) || item.isin || 'N/A',
                    insider: item.pdmr || 'Unknown',
                    title: item.position || 'Insider',
                    tradeType: tradeType,
                    shares: quantity,
                    price: price,
                    value: totalValue,
                    date: item.transactionDate || item.publicationDate || '',
                    filingDate: item.publicationDate || '',
                    instrument: item.instrumentName || '',
                    currency: item.currency || 'SEK',
                    isin: item.isin || '',
                    closePerson: item.closePerson || false
                };
            });
        }

        // Helper function to extract ticker from company name
        function extractTicker(issuer) {
            if (!issuer) return null;

            // Try to extract ticker from patterns like "Company AB (COMP)" or just use abbreviation
            const tickerMatch = issuer.match(/\(([A-Z]{2,5})\)/);
            if (tickerMatch) {
                return tickerMatch[1];
            }

            // If no ticker in parentheses, try to create one from company name
            const words = issuer.split(' ');
            if (words.length > 0) {
                // Take first letters of words, max 4 characters
                return words.map(w => w.charAt(0)).join('').substring(0, 4).toUpperCase();
            }

            return null;
        }

        function formatCurrency(amount, currency = 'SEK') {
            return new Intl.NumberFormat('sv-SE', {
                style: 'currency',
                currency: currency,
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            }).format(amount);
        }

        function formatNumber(num) {
            return new Intl.NumberFormat('sv-SE').format(num);
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            return new Date(dateString).toLocaleDateString('sv-SE', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        function createTradeCard(trade) {
            const closePersonBadge = trade.closePerson ?
                '<span class="ticker" style="background: #fff3cd; color: #856404; margin-left: 5px;">Close Person</span>' : '';

            // Construct Finansinspektionen source URL (using trade ID)
            // Note: For real implementation, you would need the actual FI URL structure
            const sourceUrl = trade.id ? `https://fi.se/en/our-registers/pdmr-transactions/?id=${trade.id}` : '#';

            return `
                <div class="trade-card">
                    <div class="trade-header">
                        <div class="company-info">
                            <div class="company-name">${trade.company}</div>
                            <span class="ticker">${trade.ticker}</span>
                            ${closePersonBadge}
                        </div>
                        <a href="${sourceUrl}" target="_blank" rel="noopener noreferrer" class="trade-type ${trade.tradeType}" title="Click to view source announcement on Finansinspektionen">
                            ${trade.tradeType} <i class="fa-solid fa-arrow-up-right-from-square external-icon"></i>
                        </a>
                    </div>

                    <div class="trade-details">
                        <div class="detail-item">
                            <span class="detail-label">Insider</span>
                            <span class="detail-value">${trade.insider}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Title</span>
                            <span class="detail-value">${trade.title}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Instrument</span>
                            <span class="detail-value">${trade.instrument || 'N/A'}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Shares</span>
                            <span class="detail-value">${formatNumber(trade.shares)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Price</span>
                            <span class="detail-value">${formatCurrency(trade.price, trade.currency)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Total Value</span>
                            <span class="detail-value">${formatCurrency(trade.value, trade.currency)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Trade Date</span>
                            <span class="detail-value">${formatDate(trade.date)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Filing Date</span>
                            <span class="detail-value">${formatDate(trade.filingDate)}</span>
                        </div>
                    </div>

                    <div class="stock-performance" id="performance-${trade.id}">
                        <div class="performance-loading">Loading current stock price...</div>
                    </div>

                    <div class="chart-container" style="display: none;" id="chart-container-${trade.id}">
                        <canvas id="chart-${trade.id}"></canvas>
                    </div>
                </div>
            `;
        }

        function filterTrades() {
            const companyFilter = document.getElementById('companyFilter').value.toLowerCase();
            const tradeTypeFilter = document.getElementById('tradeType').value;

            return allTrades.filter(trade => {
                const matchesCompany = !companyFilter ||
                    trade.company.toLowerCase().includes(companyFilter) ||
                    trade.ticker.toLowerCase().includes(companyFilter) ||
                    trade.insider.toLowerCase().includes(companyFilter);

                const matchesType = !tradeTypeFilter || trade.tradeType === tradeTypeFilter;

                return matchesCompany && matchesType;
            });
        }

        function displayTrades(trades) {
            const resultsContainer = document.getElementById('tradesResults');

            if (trades.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="no-data">
                        <h3>No trades found</h3>
                        <p>Try adjusting your search criteria</p>
                    </div>
                `;
                return;
            }

            resultsContainer.innerHTML = trades
                .sort((a, b) => new Date(b.date) - new Date(a.date))
                .map(createTradeCard)
                .join('');

            // Load stock performance for each trade
            trades.forEach(trade => {
                if (trade.ticker && trade.ticker !== 'N/A') {
                    loadStockPerformance(trade);
                }
            });
        }

        // Store share class data for each trade
        const tradeShareData = {};

        async function loadStockPerformance(trade) {
            const performanceDiv = document.getElementById(`performance-${trade.id}`);
            const chartContainer = document.getElementById(`chart-container-${trade.id}`);

            try {
                // Fetch stock data from backend (includes multiple share classes if available)
                const url = `/api/stock-data?ticker=${trade.ticker}&tradeDate=${trade.date}${trade.price > 0 ? `&insiderPrice=${trade.price}` : ''}`;
                const response = await fetch(url);

                if (!response.ok) {
                    performanceDiv.innerHTML = `<div class="performance-info">Stock data not available for ${trade.ticker}</div>`;
                    return;
                }

                const data = await response.json();

                // Check if we got multiple share classes
                if (!data.shareClasses || data.shareClasses.length === 0) {
                    performanceDiv.innerHTML = `<div class="performance-info">Stock data not available for ${trade.ticker}</div>`;
                    return;
                }

                // Store all share class data for this trade
                tradeShareData[trade.id] = {
                    shareClasses: data.shareClasses,
                    currentIndex: 0,
                    trade: trade
                };

                // If insider price is available and we have multiple share classes,
                // select the one with smallest gap
                if (trade.price > 0 && data.shareClasses.length > 1) {
                    let minGapIndex = 0;
                    let minGap = Infinity;

                    data.shareClasses.forEach((shareClass, index) => {
                        const gap = Math.abs(shareClass.currentPrice - trade.price);
                        if (gap < minGap) {
                            minGap = gap;
                            minGapIndex = index;
                        }
                    });

                    tradeShareData[trade.id].currentIndex = minGapIndex;
                }

                // Display the selected share class
                displayShareClassPerformance(trade.id);

            } catch (error) {
                console.error('Error loading stock performance:', error);
                performanceDiv.innerHTML = `<div class="performance-info">Unable to load stock performance</div>`;
            }
        }

        function displayShareClassPerformance(tradeId) {
            const shareData = tradeShareData[tradeId];
            if (!shareData) return;

            const trade = shareData.trade;
            const currentShareClass = shareData.shareClasses[shareData.currentIndex];
            const performanceDiv = document.getElementById(`performance-${tradeId}`);
            const chartContainer = document.getElementById(`chart-container-${tradeId}`);

            // Calculate performance
            const currentPrice = currentShareClass.currentPrice;
            const tradePrice = trade.price;
            const priceChange = currentPrice - tradePrice;
            const percentChange = ((priceChange / tradePrice) * 100).toFixed(2);
            const gainLoss = priceChange * trade.shares;

            const isPositive = priceChange >= 0;
            const arrow = isPositive ? '↑' : '↓';
            const colorClass = isPositive ? 'gain' : 'loss';

            // Create share class toggle button if multiple classes available
            let shareClassToggle = '';
            if (shareData.shareClasses.length > 1) {
                const availableClasses = shareData.shareClasses.map(sc => sc.ticker).join(', ');
                shareClassToggle = `
                    <button class="share-class-toggle" onclick="toggleShareClass('${tradeId}')" title="Switch between ${availableClasses}">
                        ${currentShareClass.ticker} <i class="fa-solid fa-rotate"></i>
                    </button>
                `;
            } else {
                shareClassToggle = `<span class="ticker-badge">${currentShareClass.ticker}</span>`;
            }

            performanceDiv.innerHTML = `
                <div class="performance-info">
                    <div class="performance-header">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <h4>Stock Performance Since Trade</h4>
                            ${shareClassToggle}
                        </div>
                        <button class="toggle-chart-btn" onclick="toggleChart('${tradeId}')">
                            <i class="fa-solid fa-chart-line"></i> Show Chart
                        </button>
                    </div>
                    <div class="performance-metrics">
                        <div class="metric">
                            <span class="metric-label">Trade Price:</span>
                            <span class="metric-value">${formatCurrency(tradePrice, trade.currency)}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Current Price:</span>
                            <span class="metric-value">${formatCurrency(currentPrice, trade.currency)}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Change:</span>
                            <span class="metric-value ${colorClass}">
                                ${arrow} ${formatCurrency(Math.abs(priceChange), trade.currency)} (${Math.abs(percentChange)}%)
                            </span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Position ${isPositive ? 'Gain' : 'Loss'}:</span>
                            <span class="metric-value ${colorClass}">
                                ${arrow} ${formatCurrency(Math.abs(gainLoss), trade.currency)}
                            </span>
                        </div>
                    </div>
                </div>
            `;

            // Create chart with current share class data
            if (currentShareClass.historicalPrices && currentShareClass.historicalPrices.length > 0) {
                const stockDataForChart = {
                    ticker: currentShareClass.ticker,
                    currentPrice: currentShareClass.currentPrice,
                    historicalPrices: currentShareClass.historicalPrices
                };
                createStockChart(trade, stockDataForChart);
            }
        }

        function toggleShareClass(tradeId) {
            const shareData = tradeShareData[tradeId];
            if (!shareData || shareData.shareClasses.length <= 1) return;

            // Move to next share class (cycle through)
            shareData.currentIndex = (shareData.currentIndex + 1) % shareData.shareClasses.length;

            // Update display
            displayShareClassPerformance(tradeId);
        }

        function toggleChart(tradeId) {
            const chartContainer = document.getElementById(`chart-container-${tradeId}`);
            const button = event.target.closest('button');

            if (chartContainer.style.display === 'none') {
                chartContainer.style.display = 'block';
                button.innerHTML = '<i class="fa-solid fa-chart-line"></i> Hide Chart';
            } else {
                chartContainer.style.display = 'none';
                button.innerHTML = '<i class="fa-solid fa-chart-line"></i> Show Chart';
            }
        }

        function createStockChart(trade, stockData) {
            const ctx = document.getElementById(`chart-${trade.id}`).getContext('2d');

            const dates = stockData.historicalPrices.map(p => p.date);
            const prices = stockData.historicalPrices.map(p => p.close);

            // Find the index of the trade date
            const tradeDateIndex = dates.findIndex(d => d === trade.date);

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [{
                        label: `${trade.ticker} Stock Price`,
                        data: prices,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 2,
                        pointRadius: dates.map((_, i) => i === tradeDateIndex ? 8 : 3),
                        pointBackgroundColor: dates.map((_, i) => i === tradeDateIndex ? '#ff6b6b' : '#667eea'),
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    label += formatCurrency(context.parsed.y, trade.currency);
                                    if (context.dataIndex === tradeDateIndex) {
                                        label += ' (Insider Trade Date)';
                                    }
                                    return label;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            ticks: {
                                callback: function(value) {
                                    return formatCurrency(value, trade.currency);
                                }
                            }
                        },
                        x: {
                            ticks: {
                                maxTicksLimit: 10
                            }
                        }
                    }
                }
            });
        }

        async function loadTrades() {
            const loadingIndicator = document.getElementById('loadingIndicator');
            const resultsContainer = document.getElementById('tradesResults');
            const fromDateInput = document.getElementById('fromDate');

            loadingIndicator.style.display = 'block';
            resultsContainer.innerHTML = '';

            try {
                const fromDate = fromDateInput.value || null;
                const apiData = await fetchInsiderTrades(fromDate);
                rawApiData = apiData;
                allTrades = parseApiData(apiData);

                const filteredTrades = filterTrades();
                displayTrades(filteredTrades);

                console.log('Loaded', allTrades.length, 'insider trades');
            } catch (error) {
                console.error('Failed to load trades:', error);
                resultsContainer.innerHTML = `
                    <div class="no-data">
                        <h3>Failed to load trades</h3>
                        <p>There was an error loading data from Finansinspektionen.</p>
                        <p><em>${error.message}</em></p>
                        <p style="margin-top: 15px; font-size: 0.9em;">Make sure the backend server is running on port 5001.</p>
                        <button class="btn" onclick="loadTrades()">Try Again</button>
                    </div>
                `;
            } finally {
                loadingIndicator.style.display = 'none';
            }
        }

        // Load initial data
        document.addEventListener('DOMContentLoaded', function() {
            // Set default from date to 30 days ago
            const fromDateInput = document.getElementById('fromDate');
            const thirtyDaysAgo = new Date();
            thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
            fromDateInput.value = thirtyDaysAgo.toISOString().split('T')[0];

            loadTrades();
        });

        // Add enter key support for company filter
        document.getElementById('companyFilter').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loadTrades();
            }
        });

        // Add real-time filtering
        document.getElementById('companyFilter').addEventListener('input', function() {
            // Debounced filtering
            clearTimeout(this.filterTimeout);
            this.filterTimeout = setTimeout(() => {
                const filteredTrades = filterTrades();
                displayTrades(filteredTrades);
            }, 300);
        });

        document.getElementById('tradeType').addEventListener('change', function() {
            const filteredTrades = filterTrades();
            displayTrades(filteredTrades);
        });
    </script>
</body>
</html>
